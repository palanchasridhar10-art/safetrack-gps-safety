<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeTrack — Verify OTP</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">
  <div class="card">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <span class="brand-name">SafeTrack</span>
    </div>
    <p class="subtitle">We've sent a 6-digit code to your email. It expires shortly, so enter it soon.</p>

    <form id="otpForm">
      <label for="otp">Enter OTP</label>
      <input type="text" id="otp" class="otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="______" required autofocus />

      <button type="submit" class="btn btn-primary" id="verifyBtn">Verify OTP</button>
    </form>

    <button class="btn-ghost" id="resendBtn" type="button">Didn't get a code? Start over</button>

    <div class="error-box" id="errorBox"></div>
    <div class="hint-box" id="devHint" style="display:none;"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/otp.js"></script>
</body>
</html>
