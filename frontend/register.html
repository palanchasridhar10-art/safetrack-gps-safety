<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeTrack — Create Account</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">
  <div class="card">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <span class="brand-name">SafeTrack</span>
    </div>
    <p class="subtitle">Create your account</p>

    <form id="registerForm">
      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="Your name" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />

      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" placeholder="+91XXXXXXXXXX" />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters" required autocomplete="new-password" />

      <button type="submit" class="btn btn-primary" id="registerBtn">Create account</button>
    </form>

    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>

    <p class="link-row">Already have an account? <a href="index.html">Log in</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>
