services:
  - type: web
    name: safetrack-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./safetrack.db
      - key: JWT_SECRET
        generateValue: true

  - type: static
    name: safetrack-frontend
    rootDir: frontend
    staticPublishPath: .
